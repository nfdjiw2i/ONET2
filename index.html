<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Загрузка из Worker</title>
  <style>
    body {
      background-color: #070707;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #status {
      padding: 20px;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div id="status">Загрузка данных с сервера...</div>

<script>
  const WORKER_URL = 'https://giganiga.Ivlyvcbcla.workers.dev';
  const API_KEY = 'my-super-secret-key-123'; 

  async function loadWorkerHTML() {
    try {
      const response = await fetch(WORKER_URL, {
        method: 'GET',
        headers: {
          'X-Secret-Key': API_KEY
        }
      });

      if (!response.ok) {
        throw new Error(`Ошибка сервера: ${response.status}`);
      }

      const htmlContent = await response.text();
      
      document.open();
      document.write(htmlContent);
      document.close();
    } catch (error) {
      document.getElementById('status').innerText = 'Ошибка при загрузке: ' + error.message;
      console.error(error);
    }
  }

  loadWorkerHTML();
</script>

</body>
</html>
